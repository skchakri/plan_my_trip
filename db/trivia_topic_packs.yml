---
science:
- difficulty: easy
  intro: A glass of water sits on a kitchen counter. Let's explore the states of matter.
  steps:
  - q: What state of matter is liquid water?
    options:
    - Solid
    - Liquid
    - Gas
    - Plasma
    answer: 1
    fun_fact: Water flows and takes the shape of its container — that's liquid.
  - q: Put that glass in a freezer. What state does the water become?
    options:
    - Solid
    - Liquid
    - Gas
    - Plasma
    answer: 0
    fun_fact: Frozen water is ice — a solid with a fixed shape.
  - q: Boil water on the stove. What state rises out of the pot?
    options:
    - Solid
    - Liquid
    - Gas
    - Plasma
    answer: 2
    fun_fact: Steam is water in gas form, also called water vapor.
  - q: At what Celsius temperature does pure water freeze at sea level?
    options:
    - "-10°"
    - 0°
    - 10°
    - 32°
    answer: 1
    fun_fact: 0°C — the same temperature as 32°F.
  - q: And at what Celsius temperature does it boil at sea level?
    options:
    - 80°
    - 90°
    - 100°
    - 120°
    answer: 2
    fun_fact: 100°C — bubbles form throughout the liquid.
  - q: What's the process of a liquid turning into a gas called?
    options:
    - Melting
    - Freezing
    - Evaporation
    - Condensation
    answer: 2
    fun_fact: Evaporation can happen below boiling too — that's how puddles dry up.
- difficulty: medium
  intro: Your heart is pumping blood as you read this. Let's tour the human body.
  steps:
  - q: Which organ pumps blood through the body?
    options:
    - Liver
    - Brain
    - Heart
    - Lungs
    answer: 2
    fun_fact: An adult heart beats about 100,000 times a day.
  - q: How many chambers does the human heart have?
    options:
    - '2'
    - '3'
    - '4'
    - '5'
    answer: 2
    fun_fact: Two atria on top, two ventricles on the bottom.
  - q: Which organ takes in oxygen and releases CO₂?
    options:
    - Stomach
    - Lungs
    - Kidneys
    - Pancreas
    answer: 1
    fun_fact: Tiny sacs called alveoli swap the gases with your blood.
  - q: Roughly how many bones are in an adult human body?
    options:
    - '106'
    - '156'
    - '206'
    - '306'
    answer: 2
    fun_fact: Babies have more (~270) — many fuse together while growing.
  - q: What part of blood carries oxygen?
    options:
    - White blood cells
    - Red blood cells
    - Plasma
    - Platelets
    answer: 1
    fun_fact: Red blood cells get their color from iron-rich hemoglobin.
  - q: Which organ is the body's largest by surface area?
    options:
    - Liver
    - Skin
    - Lungs
    - Intestine
    answer: 1
    fun_fact: Skin spread out covers about 2 square meters in an adult.
history:
- difficulty: medium
  intro: Let's walk through some big moments of the 20th century.
  steps:
  - q: In what year did World War II end?
    options:
    - '1942'
    - '1944'
    - '1945'
    - '1948'
    answer: 2
    fun_fact: Japan surrendered in September 1945.
  - q: Who was the US president when WWII ended?
    options:
    - Franklin D. Roosevelt
    - Harry S. Truman
    - Dwight D. Eisenhower
    - John F. Kennedy
    answer: 1
    fun_fact: Truman took over after FDR died in April 1945.
  - q: What year did humans first land on the Moon?
    options:
    - '1965'
    - '1967'
    - '1969'
    - '1972'
    answer: 2
    fun_fact: Apollo 11 landed on July 20, 1969.
  - q: Which two countries raced to be first on the Moon?
    options:
    - US and UK
    - US and Soviet Union
    - US and China
    - US and Germany
    answer: 1
    fun_fact: The Cold War 'Space Race' drove both nations to invest heavily.
  - q: Which wall fell in 1989, symbolizing the end of the Cold War in Europe?
    options:
    - Great Wall of China
    - Hadrian's Wall
    - Berlin Wall
    - Wall of Jericho
    answer: 2
    fun_fact: The Berlin Wall divided East and West Berlin for 28 years.
  - q: What major political event followed in 1991?
    options:
    - End of WWI
    - Fall of the Soviet Union
    - Founding of the EU
    - Launch of the internet
    answer: 1
    fun_fact: The USSR dissolved into 15 independent countries.
space:
- difficulty: medium
  intro: Let's take a quick tour of our solar system.
  steps:
  - q: Which planet is closest to the Sun?
    options:
    - Venus
    - Earth
    - Mercury
    - Mars
    answer: 2
    fun_fact: Mercury orbits in just 88 Earth days.
  - q: Which planet is known as the 'Red Planet'?
    options:
    - Venus
    - Mars
    - Jupiter
    - Saturn
    answer: 1
    fun_fact: Iron oxide (rust) on the surface gives Mars its color.
  - q: Which is the largest planet in our solar system?
    options:
    - Earth
    - Saturn
    - Jupiter
    - Neptune
    answer: 2
    fun_fact: Over 1,300 Earths could fit inside Jupiter.
  - q: Which planet has the most prominent ring system?
    options:
    - Jupiter
    - Saturn
    - Uranus
    - Neptune
    answer: 1
    fun_fact: Saturn's rings are mostly chunks of ice and rock.
  - q: What's the closest star to Earth?
    options:
    - Proxima Centauri
    - Polaris
    - The Sun
    - Sirius
    answer: 2
    fun_fact: Light from the Sun reaches us in about 8 minutes.
  - q: What galaxy do we live in?
    options:
    - Andromeda
    - Milky Way
    - Whirlpool
    - Triangulum
    answer: 1
    fun_fact: The Milky Way holds 100–400 billion stars.
animals:
- difficulty: easy
  intro: Let's compare some of the world's most amazing animals.
  steps:
  - q: What's the fastest land animal?
    options:
    - Lion
    - Cheetah
    - Horse
    - Greyhound
    answer: 1
    fun_fact: Cheetahs hit 70 mph in short bursts.
  - q: What's the largest animal alive today?
    options:
    - African elephant
    - Blue whale
    - Giraffe
    - Polar bear
    answer: 1
    fun_fact: Blue whales can be over 100 feet long.
  - q: How many hearts does an octopus have?
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    answer: 2
    fun_fact: Three hearts — two for gills, one for the body.
  - q: What group of animals are spiders part of?
    options:
    - Insects
    - Arachnids
    - Crustaceans
    - Reptiles
    answer: 1
    fun_fact: Arachnids have 8 legs and no antennae; insects have 6 legs.
  - q: What's a baby kangaroo called?
    options:
    - Cub
    - Joey
    - Kit
    - Pup
    answer: 1
    fun_fact: Joeys live in their mom's pouch for months.
  - q: Which mammal is the only one capable of true flight?
    options:
    - Squirrel
    - Bat
    - Possum
    - Sugar-glider
    answer: 1
    fun_fact: Other 'flying' mammals only glide — bats actually fly.
dinosaurs:
- difficulty: medium
  intro: Dinosaurs ruled Earth for over 165 million years. Let's meet a few.
  steps:
  - q: Which dinosaur's name means 'tyrant lizard king'?
    options:
    - Stegosaurus
    - Velociraptor
    - T. rex
    - Brachiosaurus
    answer: 2
    fun_fact: T. rex's full name is Tyrannosaurus rex.
  - q: Which dinosaur had three large horns on its head?
    options:
    - Triceratops
    - Stegosaurus
    - Ankylosaurus
    - Diplodocus
    answer: 0
    fun_fact: Two big brow horns and one short nose horn.
  - q: Which dinosaur had bony plates running along its back?
    options:
    - Triceratops
    - Stegosaurus
    - Velociraptor
    - Iguanodon
    answer: 1
    fun_fact: The plates may have helped with heat regulation.
  - q: Which long-necked dinosaur was a huge plant-eater?
    options:
    - Brachiosaurus
    - Allosaurus
    - Compsognathus
    - Spinosaurus
    answer: 0
    fun_fact: Brachiosaurus could reach treetops 30+ feet up.
  - q: Roughly how long ago did the non-avian dinosaurs go extinct?
    options:
    - 6 thousand years
    - 6 million
    - 66 million
    - 660 million
    answer: 2
    fun_fact: An asteroid impact 66 million years ago likely caused it.
  - q: Which modern animals are direct descendants of dinosaurs?
    options:
    - Lizards
    - Birds
    - Crocodiles
    - Snakes
    answer: 1
    fun_fact: Birds evolved from small theropod dinosaurs.
sports:
- difficulty: medium
