    - Van Gogh
    - Monet
    - Dalí
    answer: 1
    fun_fact: Vincent van Gogh, after a fight with Paul Gauguin in 1888.
  - q: Which movement is Claude Monet most associated with?
    options:
    - Cubism
    - Surrealism
    - Impressionism
    - Pop-art
    answer: 2
    fun_fact: The term came from Monet's painting 'Impression, Sunrise'.
  - q: Which artist is famous for the painting 'The Scream'?
    options:
    - Vincent van Gogh
    - Edvard Munch
    - Salvador Dalí
    - Pablo Picasso
    answer: 1
    fun_fact: Munch painted multiple versions between 1893 and 1910.
  - q: What is a portrait an artist paints of themselves called?
    options:
    - Still-life
    - Self-portrait
    - Landscape
    - Mural
    answer: 1
    fun_fact: Van Gogh painted dozens of his own self-portraits.
travel:
- difficulty: medium
  intro: Landmarks and famous cities of the world.
  steps:
  - q: In which city is the Eiffel Tower?
    options:
    - London
    - Paris
    - Rome
    - Madrid
    answer: 1
    fun_fact: Built for the 1889 World's Fair.
  - q: Roughly how tall is the Eiffel Tower to its tip?
    options:
    - 330 ft
    - 550 ft
    - 1,083 ft
    - 2,000 ft
    answer: 2
    fun_fact: About 1,083 feet (330 m) — once the tallest in the world.
  - q: The Colosseum is located in which city?
    options:
    - Athens
    - Rome
    - Florence
    - Naples
    answer: 1
    fun_fact: Completed in 80 AD; it held up to 80,000 spectators.
  - q: In which country would you visit Machu Picchu?
    options:
    - Mexico
    - Peru
    - Chile
    - Brazil
    answer: 1
    fun_fact: Built by the Inca around 1450 high in the Andes.
  - q: The Statue of Liberty was a gift from which country?
    options:
    - Spain
    - France
    - Italy
    - England
    answer: 1
    fun_fact: France gifted it to the US in 1886.
  - q: What's the name of the famous waterfall on the border of US and Canada?
    options:
    - Victoria Falls
    - Angel Falls
    - Niagara Falls
    - Iguazu Falls
    answer: 2
    fun_fact: Niagara — about 6 million cubic feet of water per minute go over Horseshoe Falls.
photography:
- difficulty: medium
  intro: Settings, lenses, light — let's tune a camera.
  steps:
  - q: What does ISO control on a camera?
    options:
    - Color balance
    - Sensor sensitivity to light
    - Shutter speed
    - Lens aperture
    answer: 1
    fun_fact: Higher ISO = brighter photo, but more grain (noise).
  - q: What's measured in 'f-stops' on a camera lens?
    options:
    - Zoom
    - Aperture
    - Shutter
    - ISO
    answer: 1
    fun_fact: f/1.8 is a wider opening than f/16 — counterintuitive but true.
  - q: Which setting controls how long light hits the sensor?
    options:
    - ISO
    - Aperture
    - Shutter-speed
    - White-balance
    answer: 2
    fun_fact: Slow shutter = motion blur; fast shutter freezes action.
  - q: What's the 'rule of thirds'?
    options:
    - Use only 3 colors
    - Divide the frame in a 3×3 grid for composition
    - Print at 3:1 ratio
    - Set ISO to a multiple of 3
    answer: 1
    fun_fact: Place key subjects along the 3×3 grid lines or intersections.
  - q: What does HDR stand for in photography?
    options:
    - High Dynamic Range
    - High Definition Render
    - Hyper Depth Resolution
    - Hue Detail Reset
    answer: 0
    fun_fact: HDR blends multiple exposures to keep both shadows and highlights visible.
  - q: What kind of lens has a very wide field of view?
    options:
    - Telephoto
    - Wide-angle
    - Macro
    - Fisheye-only
    answer: 1
    fun_fact: Wide-angle lenses (e.g., 24mm) capture more of a scene.
cooking:
- difficulty: easy
  intro: Kitchen science — temperatures, methods, and tools.
  steps:
  - q: At what Celsius temperature does water freeze?
    options:
    - "-10°"
    - 0°
    - 10°
    - 32°
    answer: 1
    fun_fact: 0°C = 32°F — both pure-water freezing points.
  - q: What cooking method involves submerging food in hot oil?
    options:
    - Boiling
    - Steaming
    - Frying
    - Grilling
    answer: 2
    fun_fact: Frying gets food crisp because oil reaches much higher temps than water.
  - q: What does 'al dente' mean for pasta?
    options:
    - Very soft
    - Firm to the bite
    - Cooked with cheese
    - Served cold
    answer: 1
    fun_fact: Italian for 'to the tooth' — pasta still has a slight chew.
  - q: Which ingredient is the leavening agent in most breads?
    options:
    - Salt
    - Sugar
    - Yeast
    - Butter
    answer: 2
    fun_fact: Yeast eats sugar and releases CO₂, which makes dough rise.
  - q: What's the safe internal temperature (°F) for cooked chicken?
    options:
    - 145°
    - 155°
    - 165°
    - 185°
    answer: 2
    fun_fact: 165°F kills harmful bacteria like salmonella.
  - q: Which cooking method uses dry heat in an enclosed space?
    options:
    - Boiling
    - Roasting
    - Poaching
    - Steaming
    answer: 1
    fun_fact: Ovens roast or bake using circulating hot air.
gardening:
- difficulty: easy
  intro: From seed to harvest — let's grow a garden.
  steps:
  - q: What do bees collect from flowers?
    options:
    - Pollen
    - Nectar
    - Both
    - Honey
    answer: 2
    fun_fact: Bees gather pollen and nectar; they make honey from nectar.
  - q: What process do plants use to make food from sunlight?
    options:
    - Respiration
    - Photosynthesis
    - Germination
    - Pollination
    answer: 1
    fun_fact: Plants combine CO₂ + water + sunlight → sugar + oxygen.
  - q: Which part of a plant typically anchors it and absorbs water?
    options:
    - Stem
    - Leaf
    - Root
    - Flower
    answer: 2
    fun_fact: Roots also pull up dissolved nutrients from the soil.
  - q: What's the pH level of neutral soil?
    options:
    - '5'
    - '6'
    - '7'
    - '8'
    answer: 2
    fun_fact: Below 7 is acidic; above 7 is alkaline.
  - q: What do you call planting different crops in the same plot over time?
    options:
    - Mulching
    - Crop-rotation
    - Pollination
    - Composting
    answer: 1
    fun_fact: Rotating crops keeps soil healthy and reduces pests.
  - q: Which insect is famous for pollinating crops alongside bees?
    options:
    - Wasps
    - Butterflies
    - Mosquitoes
    - Termites
    answer: 1
    fun_fact: Butterflies and moths are major flower visitors.
