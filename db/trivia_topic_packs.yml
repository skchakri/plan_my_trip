    options:
    - '4'
    - '5'
    - '6'
    - '7'
    answer: 1
    fun_fact: 5 per team, 10 on the court total.
  - q: How often are the Summer Olympic Games normally held?
    options:
    - Every year
    - Every 2 years
    - Every 4 years
    - Every 8 years
    answer: 2
    fun_fact: Summer and Winter Games alternate every 2 years.
  - q: Where were the first modern Olympic Games held in 1896?
    options:
    - Paris
    - Athens
    - London
    - Rome
    answer: 1
    fun_fact: Athens — Greece, the home of the original Olympics.
