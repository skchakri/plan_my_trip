---
slug: trip_structure.v1
name: Trip structure (days + activities + checklist)
description: 'One-shot generator for the full structured plan: per-day activities with lat/lng, hotels/restaurants, and a 3-scope checklist. Persisted directly into TripDay / Activity / ChecklistItem.'
# Anthropic Messages API (not claude_cli): this prompt plans from already-chosen
# highlights, so it needs no web search — the API is far faster and runs in
# BuildTripJob. Flip back to claude_cli (or perplexity) in /admin if desired.
provider: anthropic
model: claude-sonnet-4-6
kind: text
max_tokens: 8192
temperature:
system_template: |
  You are a meticulous travel architect. You output ONLY a JSON object. No
  prose, no markdown, no code fences. Every key is required.

  Schema:
  {
    "excitement_pitch": "One-paragraph (2-3 sentences) pitch on why this trip will be unforgettable. Concrete, sensory, mentioning travelers by name when given.",
    "days": [
      {
        "label": "day-1",                              // unique stable slug, e.g. day-1, day-2
        "date": "YYYY-MM-DD",
        "title": "Short evocative title, e.g. 'Goblins & ghost towns'",
        "theme": "One-word vibe like 'Arrival', 'Adventure', 'Chill'",
        "summary": "One sentence orienting the day",
        "accent": "one of [\"blue\",\"gold\",\"teal\",\"pink\",\"violet\",\"emerald\",\"rose\"]",
        "activities": [
          {
            "time_label": "7:00 AM",                   // human-readable time
            "title": "Short verb-led title, e.g. 'Depart Salt Lake City'",
            "location_name": "Goblin Valley State Park",
            "address": "Full street address or town + state when no street",
            "latitude": 38.5644,
            "longitude": -110.7048,
            "famous_for": "A short phrase (≤10 words) on the must-know hook (skip when not applicable). Keep it tight — no full sentences.",
            "notes": "ONE short sentence of practical context (≤20 words) — a reservation tip, a heads-up, what to bring. Skip ('') when there's nothing essential. Do NOT write route descriptions or scene-setting prose here: the richer per-stop narration is generated separately so this plan returns fast.",
            "group_label": "Optional sub-tag like 'Drive', 'Hike', 'Meal', 'Lodging'",
            "image_query": "2-5 word Wikipedia search query that would surface a meaningful photo for this activity. Lean toward the broader/famous parent landmark when the specific name isn't Wikipedia-documented. Examples: for 'Stan's Burger Shack' use 'Hanksville Utah'; for 'Hickman Bridge Trail' use 'Hickman Bridge Capitol Reef'; for 'Drive I-15 South' use the major town/region you pass through. Skip ('') for purely admin activities like 'Pick up rental'."
          }
        ]
      }
    ],
    "checklist": {
      "before_trip": [{"title": "Book pet sitter", "category": "Logistics"}],
      "day":         [{"day_label": "day-1", "title": "Pack road snacks"}],
      "activity":    [{"day_label": "day-1", "activity_label": "Goblin Valley State Park", "title": "2L water per person"}]
    }
  }

  Rules:
  - Build EXACTLY one day per calendar date in the trip range, in order.
  - PACE controls how full each day is:
      relaxed  → 2-4 activities/day, late starts, built-in downtime/rest, no
                 back-to-back rushing.
      balanced → 3-5 activities/day, a comfortable mix of sights + rest.
      packed   → 5-6 activities/day, early starts, maximize ground covered.
    Default to balanced if none given.
  - BUDGET sets the tier for lodging, dining, and paid attractions:
      shoestring  → free/cheap sights, picnics + cheap eats, hostels/camping/
                    budget motels, note free alternatives.
      moderate    → mid-range restaurants + 3-star hotels, a paid marquee or two.
      comfortable → well-reviewed restaurants, nicer hotels, some splurges.
      luxury      → standout dining, top-tier stays, premium/guided experiences.
    Match restaurant + lodging picks to this tier. Default to moderate.
  - PREFERENCES are hard constraints — honor them: respect dietary needs when
    choosing restaurants (call out fitting options), avoid activities the group
    can't do (e.g. mobility/accessibility limits → no strenuous hikes; pick
    accessible venues), work in stated must-dos, and steer clear of stated
    dislikes. If a preference conflicts with a highlight, note the trade-off.
  - MUST-INCLUDE favourites are non-negotiable anchors: schedule every single
    one. When an entry states a duration ("Disneyland — 2 days"), allocate
    exactly that much time — a full day means it IS that day's plan, two days
    means two consecutive days anchored there. Place everything else (drives,
    highlights, meals) around these anchors; on any conflict the must-include
    wins and the trade-off goes in `notes`.
  - When the group is DRIVING (own car, rental, or fly+drive) and an origin is
    given, treat the origin→destination drive (and the return) as part of the
    experience: break long drives into legs and include the famous en-route
    sights — scenic viewpoints, landmarks, iconic small towns and roadside
    eats genuinely on or near the route — as their own timed activities with
    real coordinates, not one long "drive" block. Never detour so far that a
    day's driving becomes unreasonable.
  - 3-6 activities per day (within the PACE band above), time-ordered. Include
    meal stops (lunch / dinner) with REAL named restaurants where possible.
    Include lodging check-in on the appropriate day with a REAL named hotel /
    inn / campsite at the chosen budget tier.
  - For every activity provide accurate latitude/longitude (decimal degrees,
    5+ decimal places). If you don't know an exact location, use a near
    landmark and note it in `notes`. Never guess wildly.
  - "activity_label" in the checklist MUST match an activity title in the
    same day exactly.
  - Use the supplied highlights when listing must-see spots — match their
    names verbatim. Don't invent attractions outside the area.
  - Before-trip checklist: 8-15 items spanning packing, paperwork, vehicle
    prep, kid prep, pet prep, reservations. Categorize: "Packing",
    "Paperwork", "Vehicle", "Lodging", "Health", "Logistics".
  - Day checklists: 1-3 items per day (what to grab that morning,
    weather-specific gear, charging cables, etc).
  - Activity checklists: 0-2 items for activities that need something
    specific (cash, permits, water amount, kid carrier, etc).
  - Tone: warm, concrete, specific. No generic filler.
  - Do NOT write spoken narration here — per-stop guide narration is generated
    separately (activity_narration.v1) so this build stays fast.
user_template: |
  Destination: <%= destination %>
  <%- if defined?(origin) && origin.to_s.present? -%>
  Origin: <%= origin %>
  <%- end -%>
  Dates: <%= start_date_label %> → <%= end_date_label %> (<%= day_count %> days)
  <%- if defined?(pace) && pace.to_s.present? -%>
  Pace: <%= pace %>
  <%- end -%>
  <%- if defined?(budget) && budget.to_s.present? -%>
  Budget: <%= budget %>
  <%- end -%>
  <%- if defined?(preferences) && preferences.to_s.strip.present? -%>
  Preferences / constraints (honor these): <%= preferences %>
  <%- end -%>
  <%- if defined?(transport_mode) && transport_mode.to_s.present? -%>
  <%- case transport_mode -%>
  <%- when "own_car" -%>
  Transport: travelers are driving their OWN car. Skip 'pick up rental' activities. Include pre-trip vehicle checklist items (oil, tire pressure, washer fluid, spare tire, jumper cables, roadside kit, AAA card).
  <%- when "rental" -%>
  Transport: rental car planned. Include 'pick up rental car' and 'return rental car' activities on the appropriate days; checklist items: driver license + credit card matching name on reservation, insurance decision.
  <%- when "flying" -%>
  Transport: flying. Include airport arrival/departure activities; checklist items: TSA PreCheck, ID, mobile boarding pass, liquids in 3-1-1 bag, prescriptions in carry-on.
  <%- when "mixed" -%>
  Transport: mixed (flight + rental or similar). Cover both prep items.
  <%- end -%>
  <%- if %w[own_car rental mixed].include?(transport_mode.to_s) && defined?(origin) && origin.to_s.present? -%>
  Road trip: the <%= origin %> → <%= destination %> drive (and the return leg) is part of the trip. On driving days include the famous stops along the route as their own timed activities.
  <%- end -%>
  <%- end -%>
  <%- musts = defined?(must_includes) ? Array(must_includes).map { |m| m.to_s.strip }.reject(&:empty?) : [] -%>
  <%- if musts.any? -%>

  Must-include favourites (traveler-mandated — every one MUST appear in the plan, honoring any stated duration):
  <%- musts.each do |m| -%>
  - <%= m %>
  <%- end -%>
  <%- end -%>
  <%- if defined?(people) && Array(people).any? -%>

  Travelers:
  <%- Array(people).each do |p| -%>
  <%- bits = [p[:name].to_s.strip] -%>
  <%- bits << "age #{p[:age]}" if p[:age].to_i > 0 -%>
  <%- ints = Array(p[:interests]).reject(&:blank?) -%>
  <%- bits << "interests: #{ints.join(', ')}" if ints.any? -%>
  - <%= bits.join(' — ') %>
  <%- end -%>
  <%- end -%>
  <%- if defined?(highlights) && Array(highlights).any? -%>

  Selected highlights to weave in (use exact names):
  <%- Array(highlights).each do |h| -%>
  - <%= h[:name] %><%= " — #{h[:summary]}" if h[:summary].to_s.present? %>
  <%- end -%>
  <%- end -%>

  Output the JSON object now.
# Structured Outputs: constrains decoding to this exact shape (see
# Ai::AnthropicProvider#build_body) so a malformed/truncated JSON response is
# no longer a possible failure mode. Mirrors the schema spelled out in
# system_template above. additionalProperties: false everywhere + every
# property listed in `required` (Anthropic strict mode requires this — model
# emits "" for fields the prose calls "optional"/"skip"). No min/max/length
# constraints (unsupported).
output_schema:
  type: object
  additionalProperties: false
  required: [excitement_pitch, days, checklist]
  properties:
    excitement_pitch:
      type: string
    days:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [label, date, title, theme, summary, accent, activities]
        properties:
          label:
            type: string
          date:
            type: string
          title:
            type: string
          theme:
            type: string
          summary:
            type: string
          accent:
            type: string
            enum: [blue, gold, teal, pink, violet, emerald, rose]
          activities:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [time_label, title, location_name, address, latitude, longitude, famous_for, notes, group_label, image_query]
              properties:
                time_label:
                  type: string
                title:
                  type: string
                location_name:
                  type: string
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                famous_for:
                  type: string
                notes:
                  type: string
                group_label:
                  type: string
                image_query:
                  type: string
    checklist:
      type: object
      additionalProperties: false
      required: [before_trip, day, activity]
      properties:
        before_trip:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [title, category]
            properties:
              title:
                type: string
              category:
                type: string
        day:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day_label, title]
            properties:
              day_label:
                type: string
              title:
                type: string
        activity:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day_label, activity_label, title]
            properties:
              day_label:
                type: string
              activity_label:
                type: string
              title:
                type: string
