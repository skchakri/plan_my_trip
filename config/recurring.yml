#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Daily digest of unread notifications. Scoped narrowly inside
  # DailyDigestJob#eligible_users so it can't accidentally spam everyone.
  daily_digest:
    class: DailyDigestJob
    schedule: at 8am every day

  # Reap abandoned wizard drafts past their TTL.
  sweep_expired_draft_trips:
    class: DraftTripSweeperJob
    schedule: at 3am every day

  # Countdown reminders to trip members 7/3/1 days before departure.
  # Idempotent per (offset + start_date) via Trip#reminders_sent.
  pre_trip_reminders:
    class: PreTripReminderJob
    schedule: at 9am every day

  # Refresh flight status (gate/delay/cancellation) for flights departing in the
  # next 24h and alert trip members on changes. No-ops without an
  # AERODATABOX_API_KEY, so it's dark until an operator opts in.
  poll_flight_status:
    class: PollFlightStatusJob
    schedule: every hour

  # Auto-answer open support tickets with the AI (support_answer.v1). Confident
  # answers go straight to the user; anything needing a human is drafted and
  # escalated to admins. PER_RUN_LIMIT in the job bounds paid AI spend.
  answer_support_tickets:
    class: AnswerSupportTicketsJob
    schedule: every hour
