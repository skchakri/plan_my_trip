# Kamal deploy config for Wanderply (wanderply.com).
# Modeled on the sibling prof_vault deploy in the same AWS account (us-east-1).
#
# Two values are filled in by provisioning (docs/ops/provision-wanderply-aws.sh):
#   • servers.*         → the wanderply-web Elastic IP
#   • env.clear.DB_HOST → the wanderply-db RDS endpoint
service: wanderply
image: wanderply

# The wanderply-web EC2 box runs both the web (Puma) and job (Solid Queue) roles.
servers:
  web:
    - REPLACE_WITH_WANDERPLY_WEB_EIP
  job:
    hosts:
      - REPLACE_WITH_WANDERPLY_WEB_EIP
    cmd: bin/jobs

# kamal-proxy terminates TLS (Let's Encrypt) for wanderply.com.
# Requires config.assume_ssl + config.force_ssl in production.rb (already set).
proxy:
  ssl: true
  host: wanderply.com,www.wanderply.com
  healthcheck:
    path: /up
    interval: 3
    timeout: 60

# Amazon ECR. Password is fetched at deploy time via the AWS CLI (see .kamal/secrets).
registry:
  server: 727185666062.dkr.ecr.us-east-1.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - PLAN_MY_TRIP_DATABASE_PASSWORD
  clear:
    # Jobs run in a dedicated `job` role (above), not inside Puma.
    SOLID_QUEUE_IN_PUMA: false
    DB_HOST: REPLACE_WITH_WANDERPLY_DB_ENDPOINT

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Local Active Storage scratch (production uploads go to S3 — see storage.yml).
volumes:
  - "wanderply_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# The EC2 box uses the ec2-user login and the wanderply key created during provisioning.
ssh:
  user: ec2-user
  keys:
    - ~/.ssh/wanderply-key.pem
